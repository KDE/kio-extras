Dependencies:
- 'on': ['Linux', 'FreeBSD', 'Windows']
  'require':
    'frameworks/extra-cmake-modules': 'Frameworks/6.24'
    'frameworks/karchive': 'Frameworks/6.24'
    'frameworks/kconfig': 'Frameworks/6.24'
    'frameworks/kconfigwidgets': 'Frameworks/6.24'
    'frameworks/kcoreaddons': 'Frameworks/6.24'
    'frameworks/kcmutils': 'Frameworks/6.24'
    'frameworks/kdbusaddons': 'Frameworks/6.24'
    'frameworks/kdoctools': 'Frameworks/6.24'
    'frameworks/kdnssd': 'Frameworks/6.24'
    'frameworks/ki18n': 'Frameworks/6.24'
    'frameworks/kio': 'Frameworks/6.24'
    'frameworks/solid': 'Frameworks/6.24'
    'frameworks/kguiaddons': 'Frameworks/6.24'
    'frameworks/syntax-highlighting': 'Frameworks/6.24'
    'graphics/libkexiv2': 'release/25.12'
    'third-party/kdsoap': '@latest'
    'third-party/qcoro': '@latest'

- 'on': ['Linux', 'FreeBSD']
  'require':
    'libraries/kdsoap-ws-discovery-client': '@latest-kf6'
    'plasma/plasma-activities': '@latest-kf6'
    'plasma/plasma-activities-stats': '@latest-kf6'

Options:
  require-passing-tests-on: [ 'Linux', 'FreeBSD' ]
